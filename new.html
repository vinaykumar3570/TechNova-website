<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .process {
            padding: 70px 20px;
            text-align: center;
        }

        .process h2 {
            font-size: 36px;
            margin-bottom: 60px;
        }

        .process-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            max-width: 1100px;
            margin: auto;
        }

        /* Horizontal line */
        .process-wrapper::before {
            content: '';
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #e4e4e4;
            z-index: 0;
        }

        .process-item {
            width: 23%;
            position: relative;
            z-index: 1;
        }

        .icon {
            width: 70px;
            height: 70px;
            background: #007bff;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .process-item h3 {
            margin-bottom: 10px;
        }

        .process-item p {
            font-size: 14px;
            color: #666;
        }

        /* Mobile Responsive */
        @media (max-width:768px) {

            .process-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }

            .process-wrapper::before {
                width: 4px;
                height: 100%;
                left: 35px;
                top: 0;
            }

            .process-item {
                width: 100%;
                display: flex;
                align-items: flex-start;
                margin-bottom: 40px;
            }

            /* icon */
            .icon {
                margin-right: 20px;
                min-width: 70px;
            }

            /* text wrapper */
            .process-item div:last-child {
                display: block;
            }

            .process-item h3 {
                margin-bottom: 8px;
            }

            .process-item p {
                display: block;
            }

           
        }

        .text {
            display: flex;
            flex-direction: column;
        }
    </style>

</head>

<body>


    <section class="process">
        <h2>How We Work</h2>

        <div class="process-wrapper">

            <div class="process-item">
                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="text">
                    <h3>Discover</h3>
                    <p>We understand your business goals and requirements.</p>
                </div>
            </div>
            <div class="process-item">
                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="text">
                    <h3>Discover</h3>
                    <p>We understand your business goals and requirements.</p>
                </div>
            </div>
            <div class="process-item">
                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="text">
                    <h3>Discover</h3>
                    <p>We understand your business goals and requirements.</p>
                </div>
            </div>
            <div class="process-item">
                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="text">
                    <h3>Discover</h3>
                    <p>We understand your business goals and requirements.</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
